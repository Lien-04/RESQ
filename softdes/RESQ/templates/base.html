<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RESQ - Disaster Response{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/resq-logo.png') }}">
</head>

<body>
<header class="app-header">
    <a class="logo" href="{{ url_for('dashboard_page') if session.user_id else '/' }}">
        <img class="logo-icon" src="{{ url_for('static', filename='images/resq-logo.png') }}">
        <span>RESQ</span>
    </a>

    <nav>
        {% if session.user_id %}
            <a href="{{ url_for('dashboard_page') }}">Dashboard</a>
            <a href="{{ url_for('report_incident_page') }}">Report</a>
            <a href="{{ url_for('view_reports_page') }}">Reports</a>
            <a href="{{ url_for('notifications_page') }}">Notifications</a>

            <!-- 🔔 FIXED BELL -->
            <a href="#" id="pushNotifToggle" onclick="togglePushNotifications(event)" 
               style="cursor:pointer;font-size:18px;">🔔</a>

            <a href="#" onclick="logout(event)">Logout</a>
        {% endif %}
    </nav>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script>
/* ================= SERVICE WORKER ================= */
let serviceWorkerRegistration = null;
let pushNotificationEnabled = false;
let vapidPublicKey = null;

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/service-worker.js')
        .then(async reg => {
            console.log('[SW] Registered');
            serviceWorkerRegistration = await navigator.serviceWorker.ready;
            initPushNotifications();
        })
        .catch(err => console.error('[SW ERROR]', err));
}

/* ================= INIT ================= */
async function initPushNotifications() {
    try {
        const res = await fetch('/api/push/vapid-public-key');
        const data = await res.json();
        vapidPublicKey = data.vapid_public_key;

        await checkPushSubscription();
        updatePushNotificationUI();

        console.log('[INIT DONE]');
    } catch (err) {
        console.error('[INIT ERROR]', err);
    }
}

/* ================= CHECK ================= */
async function checkPushSubscription() {
    if (!serviceWorkerRegistration) return;

    const sub = await serviceWorkerRegistration.pushManager.getSubscription();
    pushNotificationEnabled = !!sub;

    console.log('[CHECK] Enabled:', pushNotificationEnabled);
}

/* ================= ENABLE ================= */
async function enablePushNotifications() {
    try {
        const permission = await Notification.requestPermission();

        if (permission !== 'granted') {
            showNotification('Permission denied', 'warning');
            return false;
        }

        const subscription = await serviceWorkerRegistration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
        });

        await fetch('/api/push/subscribe', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({subscription})
        });

        showNotification('✅ Notifications Enabled');
        return true;

    } catch (err) {
        console.error('[ENABLE ERROR]', err);
        showNotification('Enable failed', 'error');
        return false;
    }
}

/* ================= DISABLE ================= */
async function disablePushNotifications() {
    try {
        const sub = await serviceWorkerRegistration.pushManager.getSubscription();
        if (!sub) return true;

        await fetch('/api/push/unsubscribe', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({endpoint: sub.endpoint})
        });

        await sub.unsubscribe();

        showNotification('❌ Notifications Disabled');
        return true;

    } catch (err) {
        console.error('[DISABLE ERROR]', err);
        return false;
    }
}

/* ================= 🔔 TOGGLE (FIXED) ================= */
async function togglePushNotifications(event) {
    event.preventDefault();

    try {
        showNotification('Processing...', 'info', 800);

        // ensure SW ready
        serviceWorkerRegistration = await navigator.serviceWorker.ready;

        await checkPushSubscription();

        console.log('[BELL CLICK] Current:', pushNotificationEnabled);

        if (pushNotificationEnabled) {
            await disablePushNotifications();
        } else {
            await enablePushNotifications();
        }

        await checkPushSubscription();
        updatePushNotificationUI();

    } catch (err) {
        console.error('[TOGGLE ERROR]', err);
        showNotification('❌ Toggle failed', 'error');
    }
}

/* IMPORTANT: bind AFTER function */
window.togglePushNotifications = togglePushNotifications;

/* ================= UI ================= */
function updatePushNotificationUI() {
    const btn = document.getElementById('pushNotifToggle');
    if (!btn) return;

    btn.style.color = pushNotificationEnabled ? '#28a745' : '#999';
}

/* ================= HELPER ================= */
function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding)
        .replace(/-/g, '+')
        .replace(/_/g, '/');

    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

/* ================= SIMPLE NOTIF ================= */
function showNotification(msg, type='success', duration=1200) {
    const div = document.createElement('div');
    div.textContent = msg;

    div.style = `
        position:fixed;top:20px;right:20px;
        background:${type==='error'?'#dc3545':'#28a745'};
        color:#fff;padding:10px;border-radius:5px;
        z-index:9999;
    `;

    document.body.appendChild(div);
    setTimeout(()=>div.remove(), duration);
}

/* ================= LOGOUT ================= */
async function logout(e) {
    e.preventDefault();
    await fetch('/api/logout', {method:'POST'});
    location.href='/';
}
</script>

{% block scripts %}{% endblock %}
</body>
</html>
