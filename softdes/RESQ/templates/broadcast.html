{% extends "base.html" %}

{% block title %}Broadcast - RESQ{% endblock %}

{% block content %}
<div class="broadcast-shell">
    <div class="card form-card" style="max-width: 700px; margin: 0 auto;">
        
        <!-- Header (from 2nd UI) -->
        <span class="eyebrow">Admin broadcast</span>
        <h1>Broadcast Announcement</h1>
        <p class="muted">
            Send a clear notification to all users. This action is restricted to administrators.
        </p>

        <!-- Form -->
        <div class="form-group">
            <label for="broadcastTitle">Title</label>
            <input id="broadcastTitle" type="text" placeholder="System Announcement" />
        </div>

        <div class="form-group">
            <label for="broadcastMessage">Message</label>
            <textarea id="broadcastMessage" rows="6" placeholder="Write your broadcast message here..."></textarea>
        </div>

        <button class="btn btn-block" onclick="sendBroadcast()">Send Broadcast</button>

        <!-- Result -->
        <div id="broadcastResult" style="margin-top: 1rem; display: none; padding: 1rem; border-radius: 8px;"></div>
    </div>
</div>

<script>
async function sendBroadcast() {
    const title = document.getElementById('broadcastTitle').value.trim() || 'System Announcement';
    const message = document.getElementById('broadcastMessage').value.trim();
    const resultDiv = document.getElementById('broadcastResult');

    // Validation (from 1st)
    if (!message) {
        resultDiv.style.display = 'block';
        resultDiv.style.background = '#f8d7da';
        resultDiv.style.color = '#721c24';
        resultDiv.textContent = 'Please provide a message for the broadcast.';
        return;
    }

    // Simple confirm (stable, no dependency)
    if (!confirm('Send this broadcast to all users?')) return;

    try {
        // Backend route preserved
        const response = await fetch('/api/admin/broadcast', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, message })
        });

        const data = await response.json();

        if (response.ok) {
            resultDiv.style.display = 'block';
            resultDiv.style.background = '#d4edda';
            resultDiv.style.color = '#155724';
            resultDiv.textContent = data.message || 'Broadcast sent successfully.';
            
            document.getElementById('broadcastMessage').value = '';
        } else {
            resultDiv.style.display = 'block';
            resultDiv.style.background = '#f8d7da';
            resultDiv.style.color = '#721c24';
            resultDiv.textContent = data.error || 'Failed to send broadcast.';
        }
    } catch (error) {
        console.error(error);
        resultDiv.style.display = 'block';
        resultDiv.style.background = '#f8d7da';
        resultDiv.style.color = '#721c24';
        resultDiv.textContent = 'Unexpected error while sending broadcast.';
    }
}
</script>

{% endblock %}
