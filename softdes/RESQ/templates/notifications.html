{% extends "base.html" %}

{% block title %}Notifications - RESQ{% endblock %}

{% block content %}
<div class="notifications page-stack">

    <!-- Modern Header UI -->
    <section class="page-hero compact">
        <div>
            <span class="eyebrow">Updates</span>
            <h1>🔔 Notifications</h1>
            <p>Review assignments, verification updates, system messages, and incident activity.</p>
        </div>
    </section>

    <!-- Toolbar -->
    <div class="card notification-toolbar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <div id="notificationsHeader">
            <span id="unreadCount" class="unread-pill" style="background: #dc3545; color: white; padding: 0.25rem 0.75rem; border-radius: 20px; font-weight: bold;">
                Loading...
            </span>
        </div>
        <button id="markAllBtn" class="btn btn-secondary" onclick="markAllAsRead()" style="display: none;">
            Mark All as Done
        </button>
    </div>
    
    <!-- Notifications List -->
    <div class="card">
        <div id="notificationsList">
            <p style="color: #666;">Loading notifications...</p>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function() {
    await loadNotifications();
});

async function loadNotifications() {
    try {
        const response = await fetch('/api/notifications');
        const data = await response.json();

        const listDiv = document.getElementById('notificationsList');
        
        // Load unread count (UNCHANGED BACKEND)
        const unreadResponse = await fetch('/api/notifications/unread');
        const unreadData = await unreadResponse.json();
        const unreadCount = unreadData.unread_count;
        
        // Update header
        const unreadSpan = document.getElementById('unreadCount');
        const markAllBtn = document.getElementById('markAllBtn');

        if (unreadCount > 0) {
            unreadSpan.textContent = unreadCount;
            unreadSpan.style.display = 'inline';
            markAllBtn.style.display = 'inline-block';
        } else {
            unreadSpan.style.display = 'none';
            markAllBtn.style.display = 'none';
        }

        if (data.notifications && data.notifications.length > 0) {
            let html = '<ul style="list-style: none; padding-left: 0;">';

            data.notifications.forEach(notification => {
                const typeColor = getNotificationTypeColor(notification.notification_type);

                html += `<li style="padding: 1rem; border-bottom: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 0.5rem;
                    ${notification.is_read ? 'opacity: 0.6;' : 'font-weight: 600; background: #fff3cd; border-left: 4px solid #ffc107;'}">`;

                html += `<div style="display: flex; justify-content: space-between; align-items: flex-start;">`;

                html += `<div style="flex: 1;">`;
                html += `<span style="background: ${typeColor}; color: white; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.7rem; margin-right: 0.5rem;">${notification.notification_type.toUpperCase()}</span>`;
                html += `<strong>${notification.title}</strong><br>`;
                html += `<span style="color: #666; font-size: 0.9rem;">${notification.message}</span>`;

                if (notification.incident_id) {
                    html += `<br><a href="/reports?id=${notification.incident_id}" style="color: #007bff; font-size: 0.8rem; text-decoration: none;">View Incident →</a>`;
                }

                html += `</div>`;

                html += `<div style="font-size: 0.8rem; color: #999; text-align: right;">`;
                html += `${new Date(notification.created_at).toLocaleString()}`;

                if (!notification.is_read) {
                    html += `<br><button onclick="markAsRead(${notification.id})"
                        style="background: #007bff; color: white; border: none; padding: 0.25rem 0.5rem;
                        border-radius: 4px; font-size: 0.7rem; margin-top: 0.25rem; cursor: pointer;">
                        Mark as Read
                    </button>`;
                }

                html += `</div>`;
                html += `</div>`;
                html += `</li>`;
            });

            html += '</ul>';
            listDiv.innerHTML = html;

        } else {
            listDiv.innerHTML = '<p style="color: #666;">No notifications</p>';
        }

    } catch (error) {
        console.error('Error loading notifications:', error);
        document.getElementById('notificationsList').innerHTML = '<p style="color: #666;">Error loading notifications</p>';
    }
}

async function markAllAsRead() {
    showModal(
        'Mark All as Done',
        'Mark all notifications as read? This will clear your unread notification count.',
        'question',
        'Yes, mark all',
        async () => {
            try {
                const response = await fetch('/api/notifications/mark-all-read', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    document.getElementById('markAllBtn').style.display = 'none';
                    document.getElementById('unreadCount').textContent = '0';
                    document.getElementById('unreadCount').style.display = 'none';
                    await loadNotifications();
                    showNotification('✓ All notifications marked as done!', 'success', 1500);
                } else {
                    const data = await response.json().catch(() => null);
                    showNotification(data?.error || 'Failed to mark all as read', 'error', 2000);
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('Error marking all as read', 'error', 2000);
            }
        }
    );
}

async function markAsRead(notificationId) {
    try {
        await fetch(`/api/notifications/${notificationId}/read`, { method: 'PUT' });
        await loadNotifications();
    } catch (error) {
        console.error('Error marking notification as read:', error);
    }
}

function getNotificationTypeColor(type) {
    const colors = {
        'alert': '#dc3545',
        'assignment': '#007bff',
        'status_update': '#ffc107',
        'verification': '#17a2b8',
        'system': '#6c757d'
    };
    return colors[type] || '#6c757d';
}
</script>
{% endblock %}
